<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corona Engine - 3D 互动体验</title>
    <style>
        /* 基础重置 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305; /* 极暗的深空蓝背景 */
            font-family: 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 参考图 2：左对齐的科技感 UI 布局 */
        .ui-container {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 8%; /* 整体靠左 */
            transform: translateY(-50%);
            color: #ffffff;
            pointer-events: none; /* 让鼠标事件穿透到画布上 */
            max-width: 800px;
        }

        /* 顶部小标题与装饰线 */
        .overline {
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            text-transform: uppercase;
        }

        .overline::before {
            content: "";
            display: inline-block;
            width: 40px;
            height: 1px;
            background-color: #ffb703; /* 呼应图3的品牌黄 */
            margin-right: 15px;
        }

        /* 主标题 */
        .title {
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin: 0;
            line-height: 1.1;
            /* 微微的发光效果 */
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* 副标题 (参考图3文案) */
        .subtitle {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-top: 25px;
            letter-spacing: 0.1em;
            line-height: 1.8;
            max-width: 600px;
        }

        /* 按钮容器 */
        .btn-group {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            pointer-events: auto; /* 恢复按钮的点击交互 */
        }

        /* 通用按钮样式 */
        .btn {
            padding: 16px 32px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 立即下载按钮 - 参考图3品牌色 + 图2硬朗锐利边缘 */
        .btn-primary {
            background-color: #ffb703;
            color: #000;
            border: 1px solid #ffb703;
        }

        .btn-primary:hover {
            background-color: #ffc233;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
        }

        /* 开源代码按钮 - 参考图2线框风格 */
        .btn-secondary {
            background-color: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

    </style>
</head>
<body>

    <div class="ui-container">
        <div class="overline">The Next Frontier</div>
        <h1 class="title">Corona Engine</h1>
        <p class="subtitle">做前沿技术的无畏探索者，<br>也做每一颗创作者灵感的引路星。</p>
        
        <div class="btn-group">
            <a href="https://github.com/CoronaEngine/CoronaEngine" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                ↓ 立即下载
            </a>
            <a href="https://github.com/CoronaEngine/CoronaEngine" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
                获取开源代码 (MIT协议)
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 场景与相机 ---
        const scene = new THREE.Scene();
        // 增加雾化效果，增强深邃感
        scene.fog = new THREE.FogExp2(0x030305, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 相机抬高并往后拉，俯视星系，增强宏大感
        camera.position.set(0, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 2. 打造绚丽的 3D 星系粒子场 (参考图1) ---
        const particleCount = 40000; // 高密度粒子
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // 颜色调色板 (深蓝、青色、紫红)
        const colorInside = new THREE.Color(0x00d2ff);  // 核心发亮青蓝
        const colorOutside = new THREE.Color(0x7000ff); // 边缘紫红

        // 生成螺旋星系
        for(let i = 0; i < particleCount; i++) {
            const i3 = i * 3;

            // 半径：粒子距离中心的距离 (中心密集，边缘稀疏)
            const radius = Math.random() * Math.random() * 60; 
            
            // 角度与螺旋分支 (3条旋臂)
            const branchAngle = (i % 3) * ((Math.PI * 2) / 3);
            const spinAngle = radius * 0.2; // 随着半径增加，旋转角度增大，形成螺旋

            // 随机发散值，让星系有厚度和朦胧感
            const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 8 * (radius * 0.1);
            const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 8 * (radius * 0.1);
            const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 8 * (radius * 0.1);

            // 计算 x, y, z 位置
            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3+1] = randomY; // 压扁 y 轴，形成圆盘状
            positions[i3+2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            // 混合颜色：核心与边缘颜色平滑过渡
            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / 60);
            
            colors[i3] = mixedColor.r;
            colors[i3+1] = mixedColor.g;
            colors[i3+2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 粒子材质
        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true, // 开启顶点颜色
            blending: THREE.AdditiveBlending, // 加法混合，越叠加越亮
            depthWrite: false, // 解决粒子互相遮挡产生的黑边问题
            transparent: true,
            opacity: 0.8
        });

        const galaxy = new THREE.Points(geometry, material);
        // 让星系稍微倾斜一点
        galaxy.rotation.x = Math.PI * 0.1; 
        scene.add(galaxy);

        // --- 3. 鼠标交互与视差 ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // 窗口自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 4. 动画循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 星系整体缓慢自转
            galaxy.rotation.y = elapsedTime * 0.05;

            // 鼠标视差平滑过渡
            targetX = mouseX * 0.0005;
            targetY = mouseY * 0.0005;

            // 整个星系随着鼠标微微倾斜
            galaxy.rotation.z += 0.05 * (targetX - galaxy.rotation.z);
            galaxy.rotation.x += 0.05 * (targetY + Math.PI * 0.1 - galaxy.rotation.x);

            // 摄像机微调，增强空间感
            camera.position.x += (mouseX * 0.01 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.01 + 30 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
